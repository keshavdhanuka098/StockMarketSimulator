<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSphere — Live Market Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;
  --surface:#111318;
  --surface2:#181c24;
  --border:#1e2330;
  --border2:#252c3a;
  --text:#e8eaf0;
  --text2:#8b92a8;
  --text3:#4a5168;
  --green:#00d97e;
  --green-dim:#0a2e1e;
  --red:#ff4d6a;
  --red-dim:#2e0a10;
  --gold:#f5a623;
  --blue:#3b82f6;
  --purple:#a78bfa;
  --accent:#00d97e;
}
body{background:transparent;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden;position:relative}
h1,h2,h3{font-family:'Syne',sans-serif}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(8,10,14,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.07);padding:0 24px;display:flex;align-items:center;gap:20px;height:60px;box-shadow:0 1px 40px rgba(0,0,0,0.5)}
.logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.5px;text-shadow:0 0 20px rgba(0,217,126,0.3)}
.logo span{color:var(--green)}
.nav-ticker{flex:1;overflow:hidden;position:relative}
.ticker-inner{display:flex;gap:32px;animation:scrollticker 60s linear infinite;white-space:nowrap;width:max-content}
@keyframes scrollticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{display:flex;gap:8px;align-items:center;font-size:12px;font-family:'DM Mono',monospace}
.ticker-item .sym{color:var(--text2);font-weight:500}
.ticker-item .price{color:var(--text)}
.ticker-item .chg{font-size:11px}
.up{color:var(--green)}.down{color:var(--red)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;margin-right:4px;flex-shrink:0;box-shadow:0 0 8px rgba(0,217,126,0.8)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(0.8)}}
.nav-btns{display:flex;gap:8px;align-items:center}
.nav-time{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);padding:4px 10px;border:1px solid var(--border2);border-radius:6px}

/* HERO */
.hero{padding:32px 24px 0;display:flex;gap:16px;flex-wrap:wrap;position:relative;z-index:10}
.market-stat{flex:1;min-width:160px;background:rgba(17,19,24,0.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px 20px;box-shadow:0 4px 20px rgba(0,0,0,0.25);transition:all 0.2s}
.market-stat .label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.market-stat .val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--text)}
.market-stat .sub{font-size:12px;margin-top:4px}

/* CONTROLS */
.controls{padding:20px 24px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative;z-index:10}
.search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:rgba(17,19,24,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px 14px}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;width:100%}
.search-box input::placeholder{color:var(--text3)}
.search-icon{color:var(--text3);font-size:16px}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:1px solid var(--border2);background:none;color:var(--text2);border-radius:8px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;transition:all .15s}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.sort-select{background:var(--surface);border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;outline:none}
.sort-select option{background:var(--surface2)}

/* GRID */
.stocks-grid{padding:0 24px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;position:relative;z-index:10}
.stock-card{background:rgba(17,19,24,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.stock-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(0,217,126,.03));pointer-events:none}
.stock-card:hover{border-color:rgba(0,217,126,0.25);background:rgba(17,19,24,0.88);transform:translateY(-3px) scale(1.01);box-shadow:0 8px 40px rgba(0,217,126,0.12),0 2px 8px rgba(0,0,0,0.4)}
.stock-card:hover::before{background:linear-gradient(135deg,transparent 40%,rgba(0,217,126,.06))}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-sym{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:-0.3px}
.card-tag{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--border2);color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.card-name{font-size:11px;color:var(--text3);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;margin-bottom:4px}
.card-chg{font-size:12px;font-family:'DM Mono',monospace;display:flex;gap:10px;align-items:center}
.card-chg .chg-pill{padding:2px 8px;border-radius:5px;font-size:11px}
.up-pill{background:var(--green-dim);color:var(--green)}
.down-pill{background:var(--red-dim);color:var(--red)}
.sparkline{margin-top:10px;height:36px;width:100%}
.volume-bar{margin-top:8px;height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.volume-fill{height:100%;border-radius:2px;background:var(--green);transition:width .5s}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:rgba(18,21,30,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:20px 20px 0 0;width:100%;max-width:900px;max-height:92vh;overflow-y:auto;padding:28px;transform:translateY(40px);transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 -20px 80px rgba(0,0,0,0.6)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.modal-sym{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px}
.modal-name{font-size:14px;color:var(--text3);margin-top:2px}
.close-btn{background:var(--border);border:none;color:var(--text2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.close-btn:hover{background:var(--border2);color:var(--text)}
.modal-price-row{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;margin-bottom:24px}
.modal-price{font-family:'DM Mono',monospace;font-size:40px;font-weight:500}
.modal-chg{font-size:18px;font-family:'DM Mono',monospace}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px}
.chart-tabs{display:flex;gap:6px;margin-bottom:16px}
.chart-tab{padding:4px 12px;border:1px solid var(--border2);background:none;color:var(--text3);border-radius:6px;cursor:pointer;font-size:12px;font-family:'DM Mono',monospace;transition:all .15s}
.chart-tab.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}
#modal-chart-canvas{width:100%!important;height:200px!important}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-box .slabel{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.stat-box .sval{font-family:'DM Mono',monospace;font-size:15px;font-weight:500}

/* AI PREDICTION */
.ai-section{background:linear-gradient(135deg,#0a1a2e,#0d1f14);border:1px solid #1a3040;border-radius:14px;padding:20px;margin-top:4px}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ai-badge{background:linear-gradient(135deg,#00d97e22,#3b82f622);border:1px solid #00d97e44;padding:4px 12px;border-radius:20px;font-size:11px;color:var(--green);font-weight:600;letter-spacing:.5px}
.ai-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700}
.ai-content{font-size:14px;line-height:1.7;color:var(--text2)}
.ai-loading{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:13px}
.ai-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);animation:bounce .8s infinite;margin:0 2px}
.ai-dots span:nth-child(2){animation-delay:.15s}
.ai-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.prediction-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pred-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.pred-label{font-size:11px;color:var(--text3);margin-bottom:6px}
.pred-val{font-family:'DM Mono',monospace;font-size:16px;font-weight:500}
.pred-prob{font-size:11px;color:var(--text3);margin-top:4px}

/* PAGINATION */
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px 24px 32px;position:relative;z-index:10}
.page-btn{padding:6px 14px;border:1px solid var(--border2);background:none;color:var(--text2);border-radius:8px;cursor:pointer;font-family:'DM Mono',monospace;font-size:13px;transition:all .15s}
.page-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.page-btn.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.page-btn:disabled{opacity:.3;cursor:default}
.page-info{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}

/* PORTFOLIO PANEL */
.portfolio-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,12,18,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(0,217,126,0.15);padding:12px 24px;display:flex;align-items:center;gap:20px;z-index:150;transform:translateY(100%);transition:transform .3s;box-shadow:0 -10px 40px rgba(0,0,0,0.4)}
.portfolio-bar.show{transform:translateY(0)}
.port-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.port-val{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;margin-top:2px}
.port-divider{width:1px;height:32px;background:var(--border2)}

/* TOAST */
.toast{position:fixed;top:70px;right:20px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-size:13px;z-index:300;transform:translateX(120%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:280px}
.toast.show{transform:translateX(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.info{border-color:var(--blue);color:var(--blue)}

/* SECTOR BADGES */
.sector-NIFTY50{border-color:#f5a62344;color:#f5a623}
.sector-IT{border-color:#3b82f644;color:#3b82f6}
.sector-BANK{border-color:#a78bfa44;color:#a78bfa}
.sector-AUTO{border-color:#f4727244;color:#f47272}
.sector-PHARMA{border-color:#34d39944;color:#34d399}
.sector-ENERGY{border-color:#fb923c44;color:#fb923c}
.sector-METAL{border-color:#94a3b844;color:#94a3b8}
.sector-FMCG{border-color:#e879f944;color:#e879f9}
.sector-GLOBAL{border-color:#22d3ee44;color:#22d3ee}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(max-width:600px){
  .stocks-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .modal{padding:20px 16px}
  .modal-price{font-size:28px}
  .prediction-bars{grid-template-columns:1fr}
}
</style>
</head>

</div>

<div class="toast" id="toast"></div>

// ===== PRICE ENGINE =====
function updatePrices() {
  liveStocks.forEach(s => {
    s.prevPrice = s.currentPrice;
    const volatility = s.sector === 'GLOBAL' ? 0.004 : 0.003;
    const drift = (Math.random()-0.48) * volatility;
    s.currentPrice = Math.max(1, s.currentPrice * (1+drift));
    s.change = s.currentPrice - s.price;
    s.changePct = (s.change/s.price)*100;
    s.history.push(s.currentPrice);
    if(s.history.length > 200) s.history.shift();
    s.volume += Math.floor(Math.random()*50000);
  });
  renderGrid();
  updateNavTicker();
  updateHeroStats();
  if(modalStock) updateModalLive();
}

// ===== SPARKLINE =====
function drawSparkline(canvas, data, up) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth||180;
  const h = canvas.height = 36;
  ctx.clearRect(0,0,w,h);
  if(!data||data.length<2) return;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max-min||1;
  const pts = data.map((v,i)=>({x:i*(w/(data.length-1)),y:h-(v-min)/range*h*0.85-h*0.05}));
  ctx.beginPath();
  pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle = up ? '#00d97e' : '#ff4d6a';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Fill
  ctx.lineTo(pts[pts.length-1].x,h);ctx.lineTo(pts[0].x,h);ctx.closePath();
  ctx.fillStyle = up ? 'rgba(0,217,126,.08)' : 'rgba(255,77,106,.08)';
  ctx.fill();
}

// ===== FILTER & SORT =====
function getFilteredSorted() {
  let arr = [...liveStocks];
  if(currentFilter !== 'ALL') arr = arr.filter(s=>s.sector===currentFilter);
  if(searchQuery) {
    const q = searchQuery.toLowerCase();
    arr = arr.filter(s=>s.sym.toLowerCase().includes(q)||s.name.toLowerCase().includes(q));
  }
  switch(currentSort) {
    case 'price-desc': arr.sort((a,b)=>b.currentPrice-a.currentPrice); break;
    case 'price-asc': arr.sort((a,b)=>a.currentPrice-b.currentPrice); break;
    case 'chg-desc': arr.sort((a,b)=>b.changePct-a.changePct); break;
    case 'chg-asc': arr.sort((a,b)=>a.changePct-b.changePct); break;
    case 'volume': arr.sort((a,b)=>b.volume-a.volume); break;
    default: arr.sort((a,b)=>a.sym.localeCompare(b.sym));
  }
  return arr;
}

// ===== GRID RENDER =====
function renderGrid() {
  const arr = getFilteredSorted();
  const total = arr.length;
  const totalPages = Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(currentPage > totalPages) currentPage = 1;
  const page = arr.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);
  const grid = document.getElementById('stocksGrid');
  
  // Check if cards already exist (update only)
  const existing = grid.querySelectorAll('.stock-card');
  if(existing.length === page.length) {
    existing.forEach((card,i) => {
      const s = page[i];
      const up = s.changePct >= 0;
      card.querySelector('.card-price').textContent = s.sector==='GLOBAL'?`₹${s.currentPrice.toFixed(0)}`:`₹${s.currentPrice.toFixed(2)}`;
      const pill = card.querySelector('.chg-pill');
      pill.textContent = `${up?'+':''}${s.changePct.toFixed(2)}%`;
      pill.className = `chg-pill ${up?'up-pill':'down-pill'}`;
      const spark = card.querySelector('.sparkline');
      drawSparkline(spark, s.history.slice(-30), up);
      const vf = card.querySelector('.volume-fill');
      if(vf) vf.style.width = Math.min(100,s.volume/s.vol*30)+'%';
    });
    renderPagination(total, totalPages);
    return;
  }
  
  grid.innerHTML = page.map(s => {
    const up = s.changePct >= 0;
    const price = s.sector==='GLOBAL'?`₹${s.currentPrice.toFixed(0)}`:`₹${s.currentPrice.toFixed(2)}`;
    return `<div class="stock-card" data-sym="${s.sym}" onclick="openModal('${s.sym}')">
      <div class="card-top">
        <span class="card-sym">${s.sym}</span>
        <span class="card-tag sector-${s.sector}">${s.sector}</span>
      </div>
      <div class="card-name">${s.name}</div>
      <div class="card-price">${price}</div>
      <div class="card-chg">
        <span class="chg-pill ${up?'up-pill':'down-pill'}">${up?'+':''}${s.changePct.toFixed(2)}%</span>
        <span style="color:var(--text3);font-size:11px">₹${Math.abs(s.change).toFixed(2)}</span>
      </div>
      <canvas class="sparkline"></canvas>
      <div class="volume-bar"><div class="volume-fill" style="width:20%;background:${up?'var(--green)':'var(--red)'}"></div></div>
    </div>`;
  }).join('');
  
  // Draw sparklines after render
  requestAnimationFrame(()=>{
    page.forEach((s,i)=>{
      const cards = grid.querySelectorAll('.stock-card');
      if(cards[i]) drawSparkline(cards[i].querySelector('.sparkline'), s.history.slice(-30), s.changePct>=0);
    });
  });
  
  renderPagination(total, totalPages);
}

function renderPagination(total, totalPages) {
  const pg = document.getElementById('pagination');
  if(totalPages <= 1){pg.innerHTML='';return;}
  let html = `<span class="page-info">${((currentPage-1)*PAGE_SIZE)+1}–${Math.min(currentPage*PAGE_SIZE,total)} of ${total}</span>`;
  html += `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">←</button>`;
  const start = Math.max(1,currentPage-2), end = Math.min(totalPages,currentPage+2);
  if(start>1) html+=`<button class="page-btn" onclick="goPage(1)">1</button>`;
  if(start>2) html+=`<span style="color:var(--text3)">…</span>`;
  for(let p=start;p<=end;p++) html+=`<button class="page-btn${p===currentPage?' active':''}" onclick="goPage(${p})">${p}</button>`;
  if(end<totalPages-1) html+=`<span style="color:var(--text3)">…</span>`;
  if(end<totalPages) html+=`<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;
  html += `<button class="page-btn" ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">→</button>`;
  pg.innerHTML = html;
}

function goPage(p) { currentPage=p; renderGrid(); window.scrollTo({top:200,behavior:'smooth'}); }

function renderModalChart() {
  const s = modalStock;
  const canvas = document.getElementById('modal-chart-canvas');
  if(modalChart) { modalChart.destroy(); modalChart=null; }
  
  let dataPoints;
  const periods = {'1D':30,'1W':60,'1M':90,'3M':120,'1Y':180};
  const n = periods[modalChartPeriod]||30;
  dataPoints = s.history.slice(-n);
  while(dataPoints.length < n) dataPoints.unshift(dataPoints[0]);
  
  const labels = dataPoints.map((_,i)=>'');
  const up = dataPoints[dataPoints.length-1] >= dataPoints[0];
  const color = up ? '#00d97e' : '#ff4d6a';
  const fillColor = up ? 'rgba(0,217,126,0.08)' : 'rgba(255,77,106,0.08)';
  
  modalChart = new Chart(canvas, {
    type:'line',
    data:{
      labels,
      datasets:[{
        data: dataPoints,
        borderColor: color,
        borderWidth: 2,
        fill: true,
        backgroundColor: fillColor,
        pointRadius: 0,
        tension: 0.3
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{
        callbacks:{label:ctx=>`₹${ctx.raw.toFixed(2)}`},
        backgroundColor:'#111318', borderColor:'#1e2330', borderWidth:1,
        titleColor:'#8b92a8', bodyColor:'#e8eaf0'

        y:{display:true,grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4a5168',font:{size:10},callback:v=>`₹${v.toFixed(0)}`}}
      }
    }
  });
}

Stock: ${s.name} (${s.sym})

Today's Change: ${s.changePct>=0?'+':''}${s.changePct.toFixed(2)}%

  }
}


// ===== THREE.JS 3D BACKGROUND =====
(function initThreeJS() {
  const canvas = document.getElementById('threeBg');
  if (!canvas) return;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 30);

  // === CANDLESTICK BARS (rising & falling) ===
  const candleGroup = new THREE.Group();
  scene.add(candleGroup);
  
  const greenMat = new THREE.MeshStandardMaterial({ color: 0x00d97e, transparent: true, opacity: 0.7, emissive: 0x003322, roughness: 0.3 });
  const redMat = new THREE.MeshStandardMaterial({ color: 0xff4d6a, transparent: true, opacity: 0.7, emissive: 0x330011, roughness: 0.3 });
  const wireMat = new THREE.MeshStandardMaterial({ color: 0x00d97e, transparent: true, opacity: 0.4, wireframe: true });

  const candles = [];
  for (let i = 0; i < 28; i++) {
    const h = 1.5 + Math.random() * 5;
    const up = Math.random() > 0.45;
    const geo = new THREE.BoxGeometry(0.5, h, 0.5);
    const mat = up ? greenMat.clone() : redMat.clone();
    mat.opacity = 0.15 + Math.random() * 0.35;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 80,
      (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 20 - 5
    );
    mesh.rotation.z = (Math.random() - 0.5) * 0.3;
    candleGroup.add(mesh);
    candles.push({ mesh, up, speed: 0.002 + Math.random() * 0.004, amp: 0.3 + Math.random() * 1.2, phase: Math.random() * Math.PI * 2 });
    
    // Wick
    const wickH = h + 0.5 + Math.random() * 1.5;
    const wickGeo = new THREE.BoxGeometry(0.06, wickH, 0.06);
    const wick = new THREE.Mesh(wickGeo, mat);
    wick.position.copy(mesh.position);
    candleGroup.add(wick);
  }

  // === FLOATING STOCK TICKERS (geometric planes) ===
  const planeGroup = new THREE.Group();
  scene.add(planeGroup);
  const planeMat = new THREE.MeshStandardMaterial({ color: 0x00d97e, transparent: true, opacity: 0.04, side: THREE.DoubleSide, wireframe: false });
  for (let i = 0; i < 6; i++) {
    const geo = new THREE.PlaneGeometry(8 + Math.random() * 12, 3 + Math.random() * 4);
    const mesh = new THREE.Mesh(geo, planeMat.clone());
    mesh.position.set((Math.random()-0.5)*60, (Math.random()-0.5)*40, -10 - Math.random()*15);
    mesh.rotation.z = (Math.random()-0.5)*0.5;
    planeGroup.add(mesh);
  }

  // === FLOATING DOTS / PARTICLES ===
  const particleCount = 300;
  const positions = new Float32Array(particleCount * 3);
  const pColors = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    positions[i*3]   = (Math.random() - 0.5) * 120;
    positions[i*3+1] = (Math.random() - 0.5) * 80;
    positions[i*3+2] = (Math.random() - 0.5) * 40 - 10;
    const up = Math.random() > 0.4;
    if (up) { pColors[i*3]=0; pColors[i*3+1]=0.85; pColors[i*3+2]=0.49; }
    else    { pColors[i*3]=1; pColors[i*3+1]=0.3;  pColors[i*3+2]=0.41; }
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
  const pMat = new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, opacity: 0.6 });
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  // === LINE GRAPH SHAPE ===
  const lineGroup = new THREE.Group();
  scene.add(lineGroup);
  for (let c = 0; c < 4; c++) {
    const pts = [];
    let y = (Math.random()-0.5)*20;
    const startX = -50;
    for (let i = 0; i < 80; i++) {
      y += (Math.random()-0.48)*2.5;
      pts.push(new THREE.Vector3(startX + i * 1.4, y, -8 - c * 4));
    }
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const up = Math.random() > 0.4;
    const lineMat = new THREE.LineBasicMaterial({ 
      color: up ? 0x00d97e : 0xff4d6a, 
      transparent: true, 
      opacity: 0.08 + c * 0.03
    });
    const line = new THREE.Line(lineGeo, lineMat);
    lineGroup.add(line);
  }

  // === SPINNING TORUS (market ring) ===
  const torusGeo = new THREE.TorusGeometry(12, 0.08, 8, 80);
  const torusMat = new THREE.MeshStandardMaterial({ color: 0x00d97e, transparent: true, opacity: 0.07, emissive: 0x003311 });
  const torus = new THREE.Mesh(torusGeo, torusMat);
  torus.position.set(18, -8, -15);
  scene.add(torus);
  
  const torus2 = new THREE.Mesh(
    new THREE.TorusGeometry(8, 0.05, 8, 60),
    new THREE.MeshStandardMaterial({ color: 0xff4d6a, transparent: true, opacity: 0.05 })
  );
  torus2.position.set(-20, 10, -18);
  scene.add(torus2);

  // === ICOSAHEDRON (market globe) ===
  const icoGeo = new THREE.IcosahedronGeometry(3.5, 1);
  const icoMat = new THREE.MeshStandardMaterial({ color: 0x00d97e, transparent: true, opacity: 0.06, wireframe: true });
  const ico = new THREE.Mesh(icoGeo, icoMat);
  ico.position.set(-25, 12, -12);
  scene.add(ico);

  // === LIGHTS ===
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const pLight1 = new THREE.PointLight(0x00d97e, 2, 80);
  pLight1.position.set(10, 10, 10);
  scene.add(pLight1);
  const pLight2 = new THREE.PointLight(0xff4d6a, 1.5, 60);
  pLight2.position.set(-10, -10, 5);
  scene.add(pLight2);

  // === MOUSE PARALLAX ===
  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  // === RESIZE ===
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // === ANIMATE ===
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.008;

    // Candlestick bob
    candles.forEach(c => {
      c.mesh.position.y += Math.sin(t * c.speed * 100 + c.phase) * 0.008;
      c.mesh.rotation.y += 0.003;
    });

    // Particles drift
    const pos = particles.geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      pos[i*3+1] += 0.012;
      if (pos[i*3+1] > 40) pos[i*3+1] = -40;
    }
    particles.geometry.attributes.position.needsUpdate = true;

    // Torus spin
    torus.rotation.x += 0.003;
    torus.rotation.z += 0.002;
    torus2.rotation.y += 0.004;
    torus2.rotation.x += 0.002;

    // Icosahedron
    ico.rotation.x += 0.004;
    ico.rotation.y += 0.005;

    // Candlegroup slow drift
    candleGroup.rotation.y = mouseX * 0.04;
    candleGroup.rotation.x = mouseY * 0.02;

    // Camera parallax
    camera.position.x += (mouseX * 3 - camera.position.x) * 0.03;
    camera.position.y += (-mouseY * 2 - camera.position.y) * 0.03;
    camera.lookAt(0, 0, 0);

    // Pulsing light
    pLight1.intensity = 1.5 + Math.sin(t * 1.5) * 0.5;
    pLight2.intensity = 1.0 + Math.sin(t * 2.1 + 1) * 0.4;

    renderer.render(scene, camera);
  }
  animate();
})();

};
